<script>
(()=>{
'use strict';
const K='skto_diary_v1',ND='Не указано',D0=[100,300,500,1000,1500,3000,5000,10000],CHK='20.11.2026';

function pt(s){s=String(s||'').trim().replace(',','.');const z=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2})$/);if(z){if(+z[2]>59)return null;const c=((+z[1])*60+(+z[2]))*100+(+z[3]);return c>0?c:null}const m=s.match(/^(?:(\d{1,2}):)?(\d{1,2})\.(\d{1,2})$/);if(!m)return null;const se=+m[2],f=m[3].length==1?+m[3]*10:+m[3];if(m[1]&&se>59)return null;const c=((m[1]?+m[1]:0)*60+se)*100+f;return c>0?c:null}
function ft(c){const p=n=>String(n).padStart(2,'0'),m=Math.floor(c/6000),r=c%6000,s=Math.floor(r/100),f=r%100;return m?m+':'+p(s)+','+p(f):s+','+p(f)}
const fd=c=>{const a=Math.abs(c);return a>=6000?ft(a)+' (мин:с)':ft(a)+' с'};
const exs_=(a,d)=>a.res.filter(x=>x.d==d&&!x.ap),best=(a,d)=>{const r=exs_(a,d);return r.length?Math.min(...r.map(x=>x.cs)):null},bestA=(a,d)=>a.res.filter(x=>x.d==d&&x.ap).sort((x,y)=>PR[y.pr||'c']-PR[x.pr||'c']||x.cs-y.cs)[0],bestR=(a,d)=>exs_(a,d).sort((x,y)=>x.cs-y.cs)[0]||bestA(a,d);
const emp=()=>({v:1,athletes:[],groups:[],rinks:[],dists:[],set:{me:'',seen:0,ch:0}});
function mig(d){d.v=d.v||1;d.athletes=d.athletes||[];d.groups=d.groups||[];d.rinks=d.rinks||[];d.dists=d.dists||[];d.set=Object.assign({me:'',seen:0,ch:0,exh:0},d.set||{});d.athletes.forEach(a=>{if(a&&a.agm!=null&&!(Number.isInteger(a.agm)&&a.agm>=0&&a.agm<6))delete a.agm});return d}
function valid(d){try{if(!d||!Array.isArray(d.athletes)||!Array.isArray(d.groups)||!Array.isArray(d.rinks))return false;
for(const a of d.athletes){if(!a.id||!Array.isArray(a.res))return false;for(const r of a.res)if(!Number.isInteger(r.cs)||r.cs<=0||!Number.isInteger(r.d))return false}
return d.groups.every(g=>g.id)&&d.rinks.every(r=>r.id)}catch(e){return false}}
let idb=null,sq=Promise.resolve(),rst=null,updAsk=0,defP=null;
const idbOpen=()=>new Promise((res,rej)=>{try{const q=indexedDB.open('skto_diary',1);q.onupgradeneeded=()=>{q.result.createObjectStore('kv')};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error||new Error('idb'));q.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}});
const idbGet=k=>new Promise((res,rej)=>{const r=idb.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbPut=(k,v)=>new Promise((res,rej)=>{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))});
async function writeRaw(s){if(idb){await idbPut('db',s);if(await idbGet('db')!==s)throw Error('Проверка записи не пройдена')}else localStorage.setItem(K,s)}
function sv(t,e){const s=$('sv');s.textContent=t;s.className=e?'e':''}
function save(){db.set.ch++;sv('Сохранение…');const s=JSON.stringify(db),ch=db.set.ch;sq=sq.then(()=>writeRaw(s)).then(()=>sv(ch>=15?'Рекомендуется резервная копия':'Сохранено')).catch(()=>sv('Ошибка сохранения',1))}
window.G=(v)=>{if(dirty&&!confirm('Есть несохранённые изменения. Выйти без сохранения?'))return;dirty=false;if(v!=view)hist.push(view);view=v;q='';R();scrollTo(0,0)};
window.B=()=>{if(dirty&&!confirm('Есть несохранённые изменения. Выйти без сохранения?'))return;dirty=false;view=hist.pop()||'home';R();scrollTo(0,0)};
const nav=()=>`<nav><button onclick="G('me')">Спортсмен</button><button onclick="G('coach')">Тренер</button><button onclick="G('cmp')">Сравнение</button><button onclick="G('ex')">Обмен</button><button onclick="G('rec')">Рекорды</button><button onclick="G('rinks')">Катки</button><button onclick="G('bk')">Копии</button>${STD?'':`<button onclick="G('ins')">Установить</button>`}<button onclick="G('about')">О приложении</button></nav>`;
const opt=(v,l,s)=>`<option value="${esc(v)}"${s?' selected':''}>${esc(l)}</option>`;
function R(){const p=view.split(':'),f={home,me,coach,g:gview,a:acard,af:aform,r:rform,rep,cmp,rec,rinks,k:kform,bk,about,ex:exm,exs,exr,exp,exh,ins:insv}[p[0]];$('app').innerHTML=nav()+f(p);
if(f===rform)XI();if(f!==rform&&f!==aform&&f!==kform)dirty=false}
document.addEventListener('input',e=>{if(e.target.closest('.frm'))dirty=true});
function home(){return`<h1>СКТО <b>|</b> Дневник конькобежца</h1><p class="m">Результаты, группы, сравнение и рекорды. Работает без интернета.</p>
<button class="big" onclick="G('me')">Я спортсмен</button><button class="big k" onclick="G('coach')">Я тренер</button>
<button class="big g" onclick="G('ex')">Обмен результатами</button>${STD?'':`<button class="g" onclick="G('ins')" style="margin-bottom:8px">Установить приложение</button>`}<div class="row"><button class="g" onclick="G('cmp')">Сравнение</button><button class="g" onclick="G('rec')">Рекорды</button><button class="g" onclick="G('bk')">Копии</button></div>
${store?'':'<div class="w">Постоянное хранилище браузера недоступно (возможно, файл открыт во временном просмотрщике). Данные не сохранятся: используйте «Копии» и открывайте файл в Safari/Chrome.</div>'}
${db.set.seen?'':'<div class="w">Данные хранятся в браузере этого устройства и могут быть потеряны (очистка, другой просмотрщик). Периодически сохраняйте резервную копию в разделе «Копии».</div>'}`}
function me(){db.set.seen=1;const a=A(db.set.me);if(!a)return aform(['af','new','','me']);return acard(['a',a.id])}
function coach(){db.set.seen=1;const n=db.athletes.filter(a=>!a.gid||!db.groups.find(g=>g.id==a.gid)).length;
return`<h1>Тренер</h1><button onclick="G('af:new:_')">+ Спортсмен</button> <button class="g" onclick="G('g:new')">+ Группа</button>
${db.groups.map(g=>`<div class="card" onclick="G('g:${g.id}')"><b>${esc(g.name)}</b><div class="m">${db.athletes.filter(a=>a.gid==g.id).length} спортсм. ${esc(g.desc||'')}</div></div>`).join('')}
<div class="card" onclick="G('g:_')"><b>Без группы</b><div class="m">${n} спортсм.</div></div>`}
function gview(p){const id=p[1];if(id=='new'){return`<h1>Новая группа</h1><div class="frm"><label>Название</label><input id="gn"><label>Описание (необязательно)</label><input id="gx"><button onclick="SG()">Сохранить</button></div>`}
const g=db.groups.find(x=>x.id==id),all=db.athletes.filter(a=>id=='_'?!a.gid||!db.groups.find(x=>x.id==a.gid):a.gid==id).filter(a=>nm(a).toLowerCase().includes(q.toLowerCase()));
if(gs=='ag')all.sort(agCmp);else if(gs)all.sort((a,b)=>(best(a,gs)??1e12)-(best(b,gs)??1e12));else all.sort((a,b)=>nm(a).localeCompare(nm(b)));
return`<h1>${g?esc(g.name):'Без группы'}</h1>${g?`<div class="m">${esc(g.desc||'')}</div><button class="g" onclick="EG('${id}')">Изменить</button> <button class="g" onclick="DG('${id}')">Удалить группу</button>`:''}
<button onclick="G('af:new:${id}')">+ Спортсмен</button><input placeholder="Поиск по имени" value="${esc(q)}" oninput="q=this.value;R2('${id}')" style="margin-top:10px">
<label>Дистанции в таблице</label><div class="row">${dists().map(d=>`<label><input type="checkbox" style="width:auto;margin:0" ${gd.includes(d)?'checked':''} onchange="TD(${d},this.checked)"> ${d}</label>`).join('')}</div>
<label>Сортировка</label><select onchange="gs=this.value=='ag'?'ag':+this.value;R()">${opt(0,'По имени',!gs)}${opt('ag','По возрастной группе',gs=='ag')}${gd.map(d=>opt(d,'По лучшему на '+d+' м',gs==d)).join('')}</select>
<div class="sc"><table><tr><th>Спортсмен</th>${gd.map(d=>`<th>${d} м</th>`).join('')}</tr>${all.map(a=>`<tr><td><a href="#" onclick="G('a:${a.id}');return false">${esc(nm(a))}</a>${agLine(a)?'<div class="ag2">'+agLine(a)+'</div>':''}</td>${gd.map(d=>{const b=best(a,d),ba=b?null:bestA(a,d);return`<td>${b?ft(b):ba?'<span class="m">'+frt(ba)+'</span>':'—'}</td>`}).join('')}</tr>`).join('')}</table></div>`}
window.R2=id=>{const p=document.activeElement,pos=p.selectionStart;R();const i=document.querySelector('#app input[placeholder]');i.focus();i.setSelectionRange(pos,pos)};
window.TD=(d,on)=>{gd=on?[...new Set([...gd,d])].sort((a,b)=>a-b):gd.filter(x=>x!=d);R()};
window.SG=()=>{const n=$('gn').value.trim();if(!n)return alert('Укажите название группы');db.groups.push({id:uid(),name:n,desc:$('gx').value.trim()});save();dirty=false;view='coach';R()};
window.EG=id=>{const g=db.groups.find(x=>x.id==id),n=prompt('Название группы',g.name);if(!n)return;g.name=n;g.desc=prompt('Описание',g.desc||'')||'';save();R()};
window.DG=id=>{if(!confirm('Удалить группу? Спортсмены останутся без группы.'))return;db.athletes.forEach(a=>{if(a.gid==id)a.gid=''});db.groups=db.groups.filter(g=>g.id!=id);save();view='coach';R()};
function aform(p){const a=p[1]=='new'?{gid:p[2]=='_'?'':p[2]||'',res:[]}:A(p[1]),isMe=p[3]=='me';
return`<h1>${p[1]=='new'?'Новый профиль':'Профиль'}</h1><p class="m">Достаточно указать любое имя. Остальное можно добавить позже.</p><div class="frm">
<label>Фамилия</label><input id="ln" value="${esc(a.ln)}"><label>Имя</label><input id="fn" value="${esc(a.fn)}"><label>Отчество</label><input id="mn" value="${esc(a.mn)}">
<label>Дата рождения</label><input id="bd" type="date" value="${esc(a.bd)}"><label>Пол</label><select id="sx" onchange="AGL()">${opt('','Не указано',!a.sx)}${opt('м','Мужской',a.sx=='м')}${opt('ж','Женский',a.sx=='ж')}</select>
<label>Разряд</label><input id="rk" value="${esc(a.rank)}"><label>Тренировочная группа</label><select id="gp">${opt('','Без группы',!a.gid)}${db.groups.map(g=>opt(g.id,g.name,a.gid==g.id)).join('')}</select>
<label>Возрастная группа</label><select id="ag">${agOpts(a.agm,a.sx)}</select><div class="m" style="margin-bottom:8px">«Автоматически»: по дате рождения, полу и спортивному сезону (1 июля – 30 июня). Ручной выбор не меняет дату рождения и не влияет на возрастные группы рекордов.</div><button class="g" type="button" onclick="$('ag').value=''" style="margin-bottom:10px">Вернуть автоматическое определение</button><br><button onclick="SA('${p[1]}',${isMe})">Сохранить</button></div>`}
window.SA=(id,me)=>{const v=i=>$(i).value.trim(),o={ln:v('ln'),fn:v('fn'),mn:v('mn'),bd:v('bd'),sx:v('sx'),rank:v('rk'),gid:v('gp'),agm:v('ag')===''?undefined:+v('ag')};
if(!o.ln&&!o.fn)return alert('Укажите фамилию или имя (или любое обозначение профиля)');
let a=id=='new'?null:A(id);if(a)Object.assign(a,o);else{a=Object.assign({id:uid(),res:[]},o);db.athletes.push(a);if(me)db.set.me=a.id}save();dirty=false;view='a:'+a.id;R()};
/* ===== Возрастные группы: алгоритм калькулятора «СКТО | Возрастные группы» (единая функция agc) ===== */
const AG=[{k:'Детский возраст',min:9,max:11,m:'Мальчики',f:'Девочки'},{k:'Младший возраст',min:12,max:13,m:'Юноши младшего возраста',f:'Девушки младшего возраста'},{k:'Средний возраст',min:14,max:15,m:'Юноши среднего возраста',f:'Девушки среднего возраста'},{k:'Старший возраст',min:16,max:17,m:'Юноши старшего возраста',f:'Девушки старшего возраста'},{k:'Юниоры / юниорки',min:18,max:19,m:'Юниоры',f:'Юниорки'},{k:'Мужчины / женщины',min:20,max:null,m:'Мужчины',f:'Женщины'}];
const pDate=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');if(!m)return null;const y=+m[1],mo=+m[2],d=+m[3],t=new Date(y,mo-1,d);return t.getFullYear()==y&&t.getMonth()==mo-1&&t.getDate()==d?{y,mo,d}:null};
const seasonOf=(y,mo)=>mo>=7?y:y-1,curSeason=()=>{const n=new Date();return seasonOf(n.getFullYear(),n.getMonth()+1)},sLab=S=>S+'/'+(S+1);
function agc(dobS,S){const b=pDate(dobS);if(!b||b.y<1900)return null;const bs=seasonOf(b.y,b.mo),age=S-bs;if(age<0)return null;let gi=-1;if(age>=9)for(let i=0;i<AG.length;i++)if(age>=AG[i].min&&(AG[i].max==null||age<=AG[i].max)){gi=i;break}
let nx=null;if(gi==-1)nx=0;else if(gi<AG.length-1)nx=gi+1;return{bs,age,gi,next:nx,nextS:nx==null?null:bs+AG[nx].min}}
const agName=(gi,sx)=>gi<0?'Вне возрастных групп':(sx=='м'||sx=='ж'?AG[gi][sx=='м'?'m':'f']:AG[gi].k);
function agNow(a){if(Number.isInteger(a.agm)&&a.agm>=0&&a.agm<AG.length)return{gi:a.agm,name:agName(a.agm,a.sx),manual:1};const r=agc(a.bd,curSeason());return r?Object.assign(r,{name:agName(r.gi,a.sx)}):null}
function agHist(a,r){const d=pDate(r.date);if(!d||!a.bd)return'';const x=agc(a.bd,seasonOf(d.y,d.mo));return x?'<div class="ag2" style="margin-top:3px">'+esc(agName(x.gi,a.sx))+'</div>':''}
const agChip=a=>{const i=agNow(a);return i?'<span class="ag">'+esc(i.name)+'</span>':''};
const agLine=a=>{const i=agNow(a);return i?esc(i.name):''};
function agNext(a){const i=agNow(a);if(!i)return'';if(i.manual)return'<div class="ag2" style="margin-top:4px">Возрастная группа выбрана вручную</div>';if(i.next==null)return'';return'<div class="ag2" style="margin-top:4px;font-size:13px">Следующая группа: <b>'+esc(agName(i.next,a.sx))+'</b><br>Переход: сезон '+sLab(i.nextS)+' (с 1 июля '+i.nextS+')</div>'}
const agKey=a=>{const i=agNow(a);return i?[i.gi,a.sx=='м'?0:a.sx=='ж'?1:2]:[99,9]};
