<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>СКТО | Дневник конькобежца</title>

<link rel="icon" href="icons/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#111;--c:#1e1e1e;--l:#363636;--r:#d4202a;--t:#f4f4f4;--m:#a0a0a0}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:720px;margin:0 auto;padding:8px max(12px,env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}#upd{display:none;position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));background:#000;border:1px solid var(--r);border-radius:12px;padding:10px;z-index:20}
.top{position:sticky;top:0;z-index:5;background:#000;border-bottom:2px solid var(--r);display:flex;gap:6px;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));padding-top:calc(8px + env(safe-area-inset-top));align-items:center}
.top span{margin-left:auto;font-size:12px;color:var(--m)}.top span.e{color:#ff6b6b;font-weight:700}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0}nav button{white-space:nowrap;background:var(--c);font-size:14px;padding:9px 12px}
button{background:var(--r);color:#fff;border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:600}button.g{background:#333}button.k{background:#000;border:1px solid var(--r)}button.big{width:100%;padding:20px;font-size:20px;margin:8px 0}
input,select,textarea{width:100%;background:#000;color:var(--t);border:1px solid var(--l);border-radius:10px;padding:12px;font-size:16px;margin:4px 0 10px}
label{font-size:13px;color:var(--m)}h1{font-size:24px;margin:10px 0 2px}h2{font-size:18px;margin:16px 0 6px;color:#fff}h1 b,h2 b{color:var(--r)}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.m{color:var(--m);font-size:13px}
.pr{color:var(--r);font-weight:800}.tm{font-size:20px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 4px;border-bottom:1px solid var(--l);text-align:left}.sc{overflow-x:auto}.best{color:var(--r);font-weight:800}
.w{background:#2a1a00;border:1px solid #7a5200;padding:10px;border-radius:10px;font-size:13px;margin:8px 0}
a{color:#ff7b82}.gr{color:#3ddc84;font-weight:700}.rd{color:#ff5a5a;font-weight:700}.bl{color:#4db8ff;font-weight:700}ol{padding-left:22px}li{margin:4px 0}
</style></head><body>
<div class="top"><button onclick="G('home')">☰ Главное меню</button><button class="g" onclick="B()">← Назад</button><span id="sv"></span></div>
<div id="app"></div><div id="upd"></div>
<script>
(()=>{
'use strict';
const K='skto_diary_v1',ND='Не указано',D0=[100,300,500,1000,1500,3000,5000,10000],CHK='20.11.2026';
let db,view='home',hist=[],dirty=false,S={a:{},b:{}},cm={d:500},rc={g:'м',t:'WR',d:500},gd=[500,1000,1500,3000],gs=0,q='',pend=null,store=true;
const $=i=>document.getElementById(i),A=i=>db.athletes.find(a=>a.id==i),RK=i=>db.rinks.find(r=>r.id==i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nm=a=>[a.ln,a.fn,a.mn].filter(Boolean).join(' ')||'Без имени';
const dists=()=>[...new Set(D0.concat(db.dists))].sort((a,b)=>a-b);
const fdt=s=>s?s.split('-').reverse().join('.'):ND;
const ROOF={in:'Крытый',out:'Открытый'},ALT={low:'Равнинный',high:'Высокогорный'};
function pt(s){s=String(s||'').trim().replace(',','.');const z=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2})$/);if(z){if(+z[2]>59)return null;const c=((+z[1])*60+(+z[2]))*100+(+z[3]);return c>0?c:null}const m=s.match(/^(?:(\d{1,2}):)?(\d{1,2})\.(\d{1,2})$/);if(!m)return null;const se=+m[2],f=m[3].length==1?+m[3]*10:+m[3];if(m[1]&&se>59)return null;const c=((m[1]?+m[1]:0)*60+se)*100+f;return c>0?c:null}
function ft(c){const p=n=>String(n).padStart(2,'0'),m=Math.floor(c/6000),r=c%6000,s=Math.floor(r/100),f=r%100;return m?m+':'+p(s)+','+p(f):s+','+p(f)}
const fd=c=>{const a=Math.abs(c);return a>=6000?ft(a)+' (мин:с)':ft(a)+' с'};
const best=(a,d)=>{const r=a.res.filter(x=>x.d==d);return r.length?Math.min(...r.map(x=>x.cs)):null};
const emp=()=>({v:1,athletes:[],groups:[],rinks:[],dists:[],set:{me:'',seen:0,ch:0}});
function mig(d){d.v=d.v||1;d.athletes=d.athletes||[];d.groups=d.groups||[];d.rinks=d.rinks||[];d.dists=d.dists||[];d.set=Object.assign({me:'',seen:0,ch:0,exh:0},d.set||{});return d}
function valid(d){try{if(!d||!Array.isArray(d.athletes)||!Array.isArray(d.groups)||!Array.isArray(d.rinks))return false;
for(const a of d.athletes){if(!a.id||!Array.isArray(a.res))return false;for(const r of a.res)if(!Number.isInteger(r.cs)||r.cs<=0||!Number.isInteger(r.d))return false}
return d.groups.every(g=>g.id)&&d.rinks.every(r=>r.id)}catch(e){return false}}
let idb=null,sq=Promise.resolve(),rst=null,updAsk=0,defP=null;
const idbOpen=()=>new Promise((res,rej)=>{try{const q=indexedDB.open('skto_diary',1);q.onupgradeneeded=()=>{q.result.createObjectStore('kv')};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error||new Error('idb'));q.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}});
const idbGet=k=>new Promise((res,rej)=>{const r=idb.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbPut=(k,v)=>new Promise((res,rej)=>{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))});
async function writeRaw(s){if(idb){await idbPut('db',s);if(await idbGet('db')!==s)throw Error('Проверка записи не пройдена')}else localStorage.setItem(K,s)}
function sv(t,e){const s=$('sv');s.textContent=t;s.className=e?'e':''}
function save(){db.set.ch++;sv('Сохранение…');const s=JSON.stringify(db),ch=db.set.ch;sq=sq.then(()=>writeRaw(s)).then(()=>sv(ch>=15?'Рекомендуется резервная копия':'Сохранено')).catch(()=>sv('Ошибка сохранения',1))}
window.G=(v)=>{if(dirty&&!confirm('Есть несохранённые изменения. Выйти без сохранения?'))return;dirty=false;if(v!=view)hist.push(view);view=v;q='';R();scrollTo(0,0)};
window.B=()=>{if(dirty&&!confirm('Есть несохранённые изменения. Выйти без сохранения?'))return;dirty=false;view=hist.pop()||'home';R();scrollTo(0,0)};
const nav=()=>`<nav><button onclick="G('me')">Спортсмен</button><button onclick="G('coach')">Тренер</button><button onclick="G('cmp')">Сравнение</button><button onclick="G('ex')">Обмен</button><button onclick="G('rec')">Рекорды</button><button onclick="G('rinks')">Катки</button><button onclick="G('bk')">Копии</button>${STD?'':`<button onclick="G('ins')">Установить</button>`}<button onclick="G('about')">О приложении</button></nav>`;
const opt=(v,l,s)=>`<option value="${esc(v)}"${s?' selected':''}>${esc(l)}</option>`;
function R(){const p=view.split(':'),f={home,me,coach,g:gview,a:acard,af:aform,r:rform,rep,cmp,rec,rinks,k:kform,bk,about,ex:exm,exs,exr,exp,exh,ins:insv}[p[0]];$('app').innerHTML=nav()+f(p);
if(f===rform)XI();if(f!==rform&&f!==aform&&f!==kform)dirty=false}
document.addEventListener('input',e=>{if(e.target.closest('.frm'))dirty=true});
function home(){return`<h1>СКТО <b>|</b> Дневник конькобежца</h1><p class="m">Результаты, группы, сравнение и рекорды. Работает без интернета.</p>
<button class="big" onclick="G('me')">Я спортсмен</button><button class="big k" onclick="G('coach')">Я тренер</button>
<button class="big g" onclick="G('ex')">Обмен результатами</button>${STD?'':`<button class="g" onclick="G('ins')" style="margin-bottom:8px">Установить приложение</button>`}<div class="row"><button class="g" onclick="G('cmp')">Сравнение</button><button class="g" onclick="G('rec')">Рекорды</button><button class="g" onclick="G('bk')">Копии</button></div>
${store?'':'<div class="w">Постоянное хранилище браузера недоступно (возможно, файл открыт во временном просмотрщике). Данные не сохранятся: используйте «Копии» и открывайте файл в Safari/Chrome.</div>'}
${db.set.seen?'':'<div class="w">Данные хранятся в браузере этого устройства и могут быть потеряны (очистка, другой просмотрщик). Периодически сохраняйте резервную копию в разделе «Копии».</div>'}`}
function me(){db.set.seen=1;const a=A(db.set.me);if(!a)return aform(['af','new','','me']);return acard(['a',a.id])}
function coach(){db.set.seen=1;const n=db.athletes.filter(a=>!a.gid||!db.groups.find(g=>g.id==a.gid)).length;
return`<h1>Тренер</h1><button onclick="G('af:new:_')">+ Спортсмен</button> <button class="g" onclick="G('g:new')">+ Группа</button>
${db.groups.map(g=>`<div class="card" onclick="G('g:${g.id}')"><b>${esc(g.name)}</b><div class="m">${db.athletes.filter(a=>a.gid==g.id).length} спортсм. ${esc(g.desc||'')}</div></div>`).join('')}
<div class="card" onclick="G('g:_')"><b>Без группы</b><div class="m">${n} спортсм.</div></div>`}
function gview(p){const id=p[1];if(id=='new'){return`<h1>Новая группа</h1><div class="frm"><label>Название</label><input id="gn"><label>Описание (необязательно)</label><input id="gx"><button onclick="SG()">Сохранить</button></div>`}
const g=db.groups.find(x=>x.id==id),all=db.athletes.filter(a=>id=='_'?!a.gid||!db.groups.find(x=>x.id==a.gid):a.gid==id).filter(a=>nm(a).toLowerCase().includes(q.toLowerCase()));
if(gs)all.sort((a,b)=>(best(a,gs)??1e12)-(best(b,gs)??1e12));else all.sort((a,b)=>nm(a).localeCompare(nm(b)));
return`<h1>${g?esc(g.name):'Без группы'}</h1>${g?`<div class="m">${esc(g.desc||'')}</div><button class="g" onclick="EG('${id}')">Изменить</button> <button class="g" onclick="DG('${id}')">Удалить группу</button>`:''}
<button onclick="G('af:new:${id}')">+ Спортсмен</button><input placeholder="Поиск по имени" value="${esc(q)}" oninput="q=this.value;R2('${id}')" style="margin-top:10px">
<label>Дистанции в таблице</label><div class="row">${dists().map(d=>`<label><input type="checkbox" style="width:auto;margin:0" ${gd.includes(d)?'checked':''} onchange="TD(${d},this.checked)"> ${d}</label>`).join('')}</div>
<label>Сортировка</label><select onchange="gs=+this.value;R()">${opt(0,'По имени',!gs)}${gd.map(d=>opt(d,'По лучшему на '+d+' м',gs==d)).join('')}</select>
<div class="sc"><table><tr><th>Спортсмен</th>${gd.map(d=>`<th>${d} м</th>`).join('')}</tr>${all.map(a=>`<tr><td><a href="#" onclick="G('a:${a.id}');return false">${esc(nm(a))}</a></td>${gd.map(d=>{const b=best(a,d);return`<td>${b?ft(b):'—'}</td>`}).join('')}</tr>`).join('')}</table></div>`}
window.R2=id=>{const p=document.activeElement,pos=p.selectionStart;R();const i=document.querySelector('#app input[placeholder]');i.focus();i.setSelectionRange(pos,pos)};
window.TD=(d,on)=>{gd=on?[...new Set([...gd,d])].sort((a,b)=>a-b):gd.filter(x=>x!=d);R()};
window.SG=()=>{const n=$('gn').value.trim();if(!n)return alert('Укажите название группы');db.groups.push({id:uid(),name:n,desc:$('gx').value.trim()});save();dirty=false;view='coach';R()};
window.EG=id=>{const g=db.groups.find(x=>x.id==id),n=prompt('Название группы',g.name);if(!n)return;g.name=n;g.desc=prompt('Описание',g.desc||'')||'';save();R()};
window.DG=id=>{if(!confirm('Удалить группу? Спортсмены останутся без группы.'))return;db.athletes.forEach(a=>{if(a.gid==id)a.gid=''});db.groups=db.groups.filter(g=>g.id!=id);save();view='coach';R()};
function aform(p){const a=p[1]=='new'?{gid:p[2]=='_'?'':p[2]||'',res:[]}:A(p[1]),isMe=p[3]=='me';
return`<h1>${p[1]=='new'?'Новый профиль':'Профиль'}</h1><p class="m">Достаточно указать любое имя. Остальное можно добавить позже.</p><div class="frm">
<label>Фамилия</label><input id="ln" value="${esc(a.ln)}"><label>Имя</label><input id="fn" value="${esc(a.fn)}"><label>Отчество</label><input id="mn" value="${esc(a.mn)}">
<label>Дата рождения</label><input id="bd" type="date" value="${esc(a.bd)}"><label>Пол</label><select id="sx">${opt('','Не указано',!a.sx)}${opt('м','Мужской',a.sx=='м')}${opt('ж','Женский',a.sx=='ж')}</select>
<label>Разряд</label><input id="rk" value="${esc(a.rank)}"><label>Тренировочная группа</label><select id="gp">${opt('','Без группы',!a.gid)}${db.groups.map(g=>opt(g.id,g.name,a.gid==g.id)).join('')}</select>
<button onclick="SA('${p[1]}',${isMe})">Сохранить</button></div>`}
window.SA=(id,me)=>{const v=i=>$(i).value.trim(),o={ln:v('ln'),fn:v('fn'),mn:v('mn'),bd:v('bd'),sx:v('sx'),rank:v('rk'),gid:v('gp')};
if(!o.ln&&!o.fn)return alert('Укажите фамилию или имя (или любое обозначение профиля)');
let a=id=='new'?null:A(id);if(a)Object.assign(a,o);else{a=Object.assign({id:uid(),res:[]},o);db.athletes.push(a);if(me)db.set.me=a.id}save();dirty=false;view='a:'+a.id;R()};
function acard(p){const a=A(p[1]);if(!a)return'<p>Спортсмен не найден</p>';const ds=dists();
return`<h1>${esc(nm(a))}</h1><div class="m">Дата рожд.: ${fdt(a.bd)} · Пол: ${a.sx=='м'?'муж.':a.sx=='ж'?'жен.':ND} · Разряд: ${esc(a.rank)||ND}<br>Группа: ${esc((db.groups.find(g=>g.id==a.gid)||{}).name)||'Без группы'}</div>
<button class="g" onclick="G('af:${a.id}')">Изменить профиль</button> <button class="g" onclick="DA('${a.id}')">Удалить</button>
<h2>Добавить <b>результат</b></h2><div class="row"><select id="nd">${ds.map(d=>opt(d,d+' м',d==500)).join('')}</select><button onclick="G('r:${a.id}:new:'+$('nd').value)">+ Результат</button></div>
${ds.filter(d=>a.res.some(r=>r.d==d)).map(d=>{const rs=a.res.filter(r=>r.d==d).sort((x,y)=>x.cs-y.cs);return`<h2>${d} м <span class="m">(${rs.length}/5)</span></h2>${rs.map((r,i)=>`<div class="card" onclick="G('r:${a.id}:${r.id}')"><span class="tm ${i?'':'pr'}">${ft(r.cs)}</span>${i?'':' <span class="pr">ЛР</span>'}<div class="m">${fdt(r.date)} · ${esc((RK(r.rink)||{}).name)||'Каток: '+ND}${r.comp?' · '+esc(r.comp):''}${r.det?' · круги':''}${r.note?' · '+esc(r.note):''}</div></div>`).join('')}`}).join('')}`}
window.DA=id=>{if(!confirm('Удалить спортсмена и все его результаты?'))return;db.athletes=db.athletes.filter(a=>a.id!=id);if(db.set.me==id)db.set.me='';save();view='home';hist=[];R()};
function rform(p){const a=A(p[1]),isN=p[2]=='new',r=isN?{d:+p[3]||500}:a.res.find(x=>x.id==p[2]);if(!r)return'<p>Не найдено</p>';
dd={on:0,plan:[],tr:[],cr:[],m:[],d:r.d};if(r.det){const g=r.det.segs;dd.on=1;dd.plan=g.map(z=>z.l);dd.tr=g.map(z=>z.t!=null?ft(z.t):'');dd.cr=g.map(z=>z.m&&z.c!=null?ft(z.c):'');dd.m=g.map(z=>z.m?1:0)}
return`<h1>${esc(nm(a))}</h1><h2>${isN?'Новый':'Редактирование'} <b>результат</b></h2><div class="frm">
<label>Дистанция *</label><select id="d">${dists().map(d=>opt(d,d+' м',d==r.d)).join('')}</select><label>или другая дистанция, м</label><input id="d2" type="number" inputmode="numeric" placeholder="нестандартная">
<label>Время * (42.35, 1:25,67, 01.25.67)</label><input id="t" inputmode="decimal" value="${r.cs?ft(r.cs):''}"><label>Дата (необязательно)</label><input id="dt" type="date" value="${esc(r.date)}">
<label>Каток</label><select id="rk" onchange="$('nk').style.display=this.value=='__new'?'block':'none'">${opt('',ND,!r.rink)}${db.rinks.map(k=>opt(k.id,k.name+(k.city?', '+k.city:''),r.rink==k.id)).join('')}${opt('__new','+ Новый каток…')}</select>
<div id="nk" style="display:none" class="card">${kfields({})}</div><label>Соревнования (необязательно)</label><input id="cp" value="${esc(r.comp)}"><label>Примечание</label><input id="nt" value="${esc(r.note)}"><button class="g" type="button" onclick="XO()" style="margin-bottom:8px">Детализация результата</button><div id="det">${detH()}</div>
<button onclick="SR('${a.id}','${isN?'new':r.id}',0)">Сохранить</button> ${isN?`<button class="k" onclick="SR('${a.id}','new',1)">Сохранить и добавить следующий</button>`:`<button class="g" onclick="DR('${a.id}','${r.id}')">Удалить</button>`}</div>`}
const kfields=k=>`<label>Название катка</label><input id="kn" value="${esc(k.name)}"><label>Город</label><input id="kc" value="${esc(k.city)}"><label>Страна</label><input id="kt" value="${esc(k.country)}">
<label>Тип</label><select id="kr">${opt('',ND,!k.roof)}${opt('in','Крытый',k.roof=='in')}${opt('out','Открытый',k.roof=='out')}</select>
<label>Высота над уровнем моря, м</label><input id="ka" type="number" inputmode="numeric" value="${esc(k.alt)}"><label>Категория</label><select id="kh">${opt('',ND,!k.ac)}${opt('low','Равнинный',k.ac=='low')}${opt('high','Высокогорный',k.ac=='high')}</select>`;
const rdk=()=>{const v=i=>$(i).value.trim();return{name:v('kn'),city:v('kc'),country:v('kt'),roof:v('kr'),alt:v('ka'),ac:v('kh')}};
window.SR=(aid,rid,next)=>{const a=A(aid),cs=pt($('t').value);if(!cs)return alert('Введите время в формате 42.35, 1:25,67 или 15:24.56');
const d2=+$('d2').value;let d=d2>0?d2:+$('d').value;if(!Number.isInteger(d)||d<=0)return alert('Неверная дистанция');const gd2=getDet(d);if(gd2.err)return alert(gd2.err);
let rink=$('rk').value;if(rink=='__new'){const k=rdk();if(!k.name)return alert('Укажите название нового катка');k.id=uid();db.rinks.push(k);rink=k.id}
